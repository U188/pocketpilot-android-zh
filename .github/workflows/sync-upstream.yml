name: Sync upstream and build Chinese APK

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

concurrency:
  group: upstream-sync-main
  cancel-in-progress: false

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out translation repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git and merge upstream
        id: sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/renderr03/pocketpilot-android.git
          git fetch upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Upstream is already included."
          else
            git merge --no-edit upstream/main
          fi
          if ! git diff --quiet origin/main HEAD; then
            git push origin HEAD:main
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Restore stable debug signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > debug.keystore

      - name: Build Chinese debug APK
        run: |
          gradle_version=$(sed -n 's/.*gradle-\([0-9.]*\)-bin.zip.*/\1/p' gradle/wrapper/gradle-wrapper.properties)
          curl -fsSL "https://services.gradle.org/distributions/gradle-${gradle_version}-bin.zip" -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          "/tmp/gradle-${gradle_version}/bin/gradle" assembleDebug --stacktrace -PversionCode=${{ github.run_number }} -PversionName=zh.1.0.${{ github.run_number }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pocketpilot-android-zh-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Chinese APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v1.0.${{ github.run_number }}"
          gh release create "$tag" app/build/outputs/apk/debug/app-debug.apk \
            --repo "${{ github.repository }}" \
            --title "$tag" \
            --notes "PocketPilot 简体中文版构建 ${{ github.run_number }}。上游提交：${{ github.sha }}" \
            --latest
