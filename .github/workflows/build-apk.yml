name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Find project root (unpack project.zip if present)
        run: |
          if [ -f project.zip ]; then
            mkdir -p app_src
            unzip -q -o project.zip -d app_src
          fi
          SETTINGS=$(find . -maxdepth 4 -name 'settings.gradle*' -not -path './.git/*' | awk '{print length, $0}' | sort -n | head -n1 | cut -d' ' -f2-)
          if [ -z "$SETTINGS" ]; then echo "settings.gradle not found"; exit 1; fi
          echo "ROOT=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Restore (or create) signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          cd "$ROOT"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > debug.keystore
          else
            echo "WARNING: KEYSTORE_B64 secret not set, generating a temporary key (updates over an installed app will NOT work)"
            keytool -genkeypair -keystore debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build debug APK
        run: |
          cd "$ROOT"
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace -PversionCode=${{ github.run_number }} -PversionName=1.0.${{ github.run_number }}
          else
            V=$(grep -h distributionUrl gradle/wrapper/gradle-wrapper.properties 2>/dev/null | sed -E 's/.*gradle-([0-9.]+)-.*/\1/')
            V=${V:-8.13}
            echo "Using Gradle $V"
            curl -sSL -o /tmp/gradle.zip "https://services.gradle.org/distributions/gradle-$V-bin.zip"
            unzip -q /tmp/gradle.zip -d /tmp
            /tmp/gradle-$V/bin/gradle assembleDebug --stacktrace -PversionCode=${{ github.run_number }} -PversionName=1.0.${{ github.run_number }}
          fi

      - name: Collect APK
        run: |
          mkdir -p out
          find "$ROOT" -path '*build/outputs/apk/debug/*.apk' -exec cp {} out/app-debug.apk \;
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: out/app-debug.apk

      - name: Publish release (versioned)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" out/app-debug.apk \
            --title "v1.0.${{ github.run_number }}" \
            --notes "Build ${{ github.run_number }}" --latest
